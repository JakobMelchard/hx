# Closes the loop: every hx change runs every consumer's full suite against that exact hx sha.
name: consumers-e2e
on:
  workflow_call:
    inputs: { hx-ref: { type: string, required: true } }
jobs:
  load:
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.m.outputs.matrix }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `name` is the bare repo, which create-github-app-token wants; GitHub
      # expressions have no split(), so derive it here rather than in the job.
      # `e2e` is the consumer's own command; interviews has to build its Python
      # server before Playwright can drive it.
      - id: m
        run: |
          echo "matrix=$(jq -c '[.[] | {e2e: "npm run e2e"} + . + {name: (.repo | split("/") | .[1])}]' consumers.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: load
    strategy: { fail-fast: false, matrix: { consumer: '${{ fromJSON(needs.load.outputs.matrix) }}' } }
    runs-on: ubuntu-latest
    steps:
      # github.token only reads this repo, so a private consumer 404s on
      # checkout. The melchbot app is installed org-wide; mint a token scoped
      # to just this consumer, read-only, revoked when the job ends. Its
      # credentials come from Infisical over OIDC; runs without an OIDC token
      # (Dependabot, forks) fall back to github.token.
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        continue-on-error: true
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
      - name: mint app token
        id: app
        if: env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.consumer.name }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '${{ matrix.consumer.repo }}'
          ref: '${{ matrix.consumer.ref }}'
          token: '${{ steps.app.outputs.token || github.token }}'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24' }
      # Consumers are checked out from another repo, so this cannot call the
      # shared node.yml — that workflow builds its own caller's checkout.
      - run: npm install && npm i --no-save "github:JakobMelchard/hx#${{ inputs.hx-ref }}"
      - run: npx playwright-core install --with-deps chromium
      - run: npx tsc && npm test && ${{ matrix.consumer.e2e }}
